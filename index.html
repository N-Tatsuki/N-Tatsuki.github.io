<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中谷 樹 | 東京科学大学 博士後期課程</title>
<meta name="description" content="東京科学大学 博士後期課程。複合材料のろう付・金属3D積層造形、宇宙政策、探究活動支援に関する研究業績とプロジェクトを掲載しています。">

<!-- OGP（SNSでリンクを共有したときの表示。URLと画像は公開後に書き換えてください） -->
<meta property="og:type" content="website">
<meta property="og:title" content="中谷 樹 | 東京科学大学 博士後期課程">
<meta property="og:description" content="複合材料のろう付・金属3D積層造形、宇宙政策、探究活動支援。">
<meta property="og:url" content="https://n-tatsuki.github.io/">
<meta property="og:image" content="https://n-tatsuki.github.io/images/ogp.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<a class="skip" href="#main">本文へスキップ</a>

<div class="shell">

  <!-- ============ 左サイドバー（スマホでは上部の帯になります） ============ -->
  <header class="rail">
    <div class="rail__id">
      <p class="rail__name" data-bind="nameJa">中谷 樹</p>
      <p class="rail__name-en" data-bind="nameEn">Tatsuki Nakatani</p>
      <p class="rail__affil" data-bind="affiliation"></p>
    </div>

    <!-- 項目は main.js が自動生成します -->
    <nav class="rail__nav" id="railNav" aria-label="ページ内ナビゲーション"></nav>

    <p class="rail__foot">&copy; <span data-bind="year"></span> Tatsuki Nakatani</p>
  </header>

  <!-- ============ 本文 ============ -->
  <main class="main" id="main">

    <!-- ---- 冒頭 ---- -->
    <section class="hero">
      <p class="hero__eyebrow">Doctoral Researcher / Materials Science</p>
      <h1 class="hero__name">
        <span class="hero__ja" data-bind="nameJa">中谷 樹</span>
        <span class="hero__en" data-bind="nameEn">Tatsuki Nakatani</span>
      </h1>
      <p class="hero__lead" data-bind="lead"></p>
    </section>

    <!-- ---- 目次（main.js が自動生成します） ---- -->
    <nav class="toc" aria-label="目次">
      <p class="toc__label">目次</p>
      <ol class="toc__list" id="tocList"></ol>
    </nav>

    <!-- ---- 学歴 ---- -->
    <section class="sec" id="education">
      <h2 class="sec__title"><span class="sec__eyebrow">Education</span>学歴</h2>
      <ol class="track" id="educationList"></ol>
    </section>

    <!-- ---- 研究テーマと業績 ---- -->
    <section class="sec" id="research">
      <h2 class="sec__title"><span class="sec__eyebrow">Research</span>研究テーマ</h2>
      <p class="sec__note">各テーマの下に、関連する業績を種別ごとにまとめています。</p>
      <div id="themes"></div>
    </section>

    <!-- ---- プロジェクト ---- -->
    <section class="sec" id="projects">
      <h2 class="sec__title"><span class="sec__eyebrow">Projects</span>プロジェクト</h2>
      <div class="cards" id="projectList"></div>
    </section>

    <!-- ---- 職歴 ---- -->
    <section class="sec" id="experience">
      <h2 class="sec__title"><span class="sec__eyebrow">Experience</span>職歴</h2>
      <ol class="track" id="experienceList"></ol>
    </section>

    <!-- ---- リンクと連絡先 ---- -->
    <section class="sec" id="contact">
      <h2 class="sec__title"><span class="sec__eyebrow">Links</span>外部リンク</h2>
      <ul class="links" id="linkList"></ul>
      <p class="contact__mail">Email: <span data-bind="email"></span></p>
    </section>
  </main>
</div>

<script src="data.js"></script>
<script src="main.js"></script>
</body>
</html>
