<script>
/* =====================================================================
   data.js の内容を読み取ってページを組み立てます。
   通常はこのファイルを編集する必要はありません。
   ===================================================================== */
(function () {
  "use strict";

  var D = window.SITE_DATA || {};
  var P = D.profile || {};

  /* ナビゲーションと目次はこの一覧から生成されます */
  var SECTIONS = [
    { id: "education",  ja: "学歴",         en: "Education" },
    {
      id: "research", ja: "研究", en: "Research",
      children: [
        { id: "theme-brazing", ja: "複合材料の接合に関する研究" },
        { id: "theme-metal-am", ja: "金属3D積層造形に関する研究" },
        { id: "theme-space-policy", ja: "宇宙政策に関する研究" },
        { id: "theme-inquiry", ja: "学士課程の探究活動に関する研究" }
      ]
    },
    { id: "projects",   ja: "プロジェクト",  en: "Projects" },
    { id: "experience", ja: "仕事",         en: "Experience" },
    { id: "links",      ja: "外部リンク",    en: "Links" },
    { id: "contact",    ja: "連絡先",        en: "Contact" }
  ];

  /* 業績種別の表示名と並び順 */
  var TYPE_ORDER = ["journal", "international", "domestic", "award", "grant", "misc"];
  var TYPE_LABEL = {
    journal: "論文",
    international: "国際会議",
    domestic: "国内会議・研究会",
    award: "受賞",
    grant: "競争的資金等の研究課題",
    misc: "その他"
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function byId(id) { return document.getElementById(id); }

  /* ---------- 基本情報の差し込み ---------- */
  function fillBindings() {
    var map = {
      nameJa: P.nameJa,
      nameEn: P.nameEn,
      affiliation: P.affiliation,
      lead: P.lead,
      contactEmail: P.contactEmail,
      year: new Date().getFullYear()
    };
    Object.keys(map).forEach(function (key) {
      if (map[key] == null) return;
      document.querySelectorAll('[data-bind="' + key + '"]').forEach(function (el) {
        el.textContent = String(map[key]);
      });
    });
  }

  /* ---------- サイドバーのナビゲーション ---------- */
  function renderNav() {
    var nav = byId("railNav");
    if (!nav) return;
    nav.innerHTML = SECTIONS.map(function (s) {
      var mainLink = '<a class="rail__nav-main" href="#' + s.id + '">' + esc(s.ja) + "</a>";
      if (!Array.isArray(s.children) || s.children.length === 0) return mainLink;
      var children = s.children.map(function (c) {
        return '<a class="rail__nav-sub" href="#' + c.id + '">' + esc(c.ja) + "</a>";
      }).join("");
      return '<div class="rail__nav-group">' + mainLink +
        '<div class="rail__subnav">' + children + "</div></div>";
    }).join("");
  }

  /* ---------- 業績1件分 ---------- */
  var pubCounter = 0;

  function citationText(p) {
    var venue = String(p.venue || p.program || "")
      .replace(/\s*\/\s*Impact Factor.*$/i, "")
      .trim();

    /* 掲載情報の末尾にある出版年月を分離する */
    var dateMatch = venue.match(/（(\d{4})年(\d{1,2})月）/);
    var year = dateMatch ? dateMatch[1] : String(p.year || "");
    var month = dateMatch ? String(Number(dateMatch[2])) : "";
    venue = venue.replace(/（\d{4}年\d{1,2}月）/g, "").trim();

    /* 日本語業績は「2024年9月」、英語業績は「2026.1」の形式 */
    var isJapanese = /[\u3040-\u30ff\u3400-\u9fff]/.test(String(p.title || ""));
    var published = "";
    if (year) {
      if (isJapanese) published = year + "年" + (month ? month + "月" : "");
      else published = year + (month ? "." + month : "");
    }

    var parts = [p.authors, p.title, venue, published].filter(Boolean);
    return parts.join("，");
  }

  function pubItem(p) {
    var lines = [p.authors, p.venue, p.program, p.role, p.number]
      .filter(Boolean).map(esc).join("<br>");
    var badges = Array.isArray(p.badges) && p.badges.length
      ? '<div class="pub__badges">' + p.badges.map(function (b) {
          return '<span class="pub__badge">' + esc(b) + '</span>';
        }).join("") + '</div>'
      : "";
    var titleBlock = p.abstract
      ? '<details class="pub__details"><summary class="pub__title pub__summary">' + esc(p.title) + '</summary>' +
        '<div class="pub__abstract"><span class="pub__abstract-label">Abstract</span><p>' + esc(p.abstract) + '</p></div></details>'
      : '<p class="pub__title">' + esc(p.title) + '</p>';

    var citeId = "pub-citation-" + (++pubCounter);
    var actions = '<div class="pub__actions">' +
      (p.url ? '<a class="pub__action-link" href="' + esc(p.url) + '" target="_blank" rel="noopener">URL</a>' : '') +
      (p.authors ? '<button class="pub__action-link pub__bib-toggle" type="button" aria-expanded="false" aria-controls="' + citeId + '">BibTex</button>' : '') +
      '</div>';
    var citePanel = p.authors
      ? '<div class="pub__cite-panel" id="' + citeId + '" hidden>' +
          '<div class="pub__cite-head"><span>論文情報</span><button class="pub__copy" type="button" data-copy-target="' + citeId + '-text">Copy</button></div>' +
          '<code class="pub__cite-text" id="' + citeId + '-text">' + esc(citationText(p)) + '</code>' +
        '</div>'
      : '';

    return '<li class="pub">' +
      '<span class="pub__year">' + esc(p.period || p.year) + "</span>" +
      "<div>" +
        titleBlock +
        badges +
        (lines ? '<p class="pub__meta">' + lines + "</p>" : "") +
        actions + citePanel +
      "</div></li>";
  }

  /* 新しい順に並べる。period が "2025 — 2026" の場合は先頭の数字を使う */
  function sortKey(p) {
    if (p.year) return Number(p.year) || 0;
    var m = String(p.period || "").match(/\d{4}/g);
    return m ? Number(m[m.length - 1]) : 0;
  }

  /* ---------- 研究テーマと業績 ---------- */
  function renderPublicationGroups(items) {
    if (!items || items.length === 0) return "";
    return TYPE_ORDER.map(function (type) {
      var group = items
        .filter(function (p) { return p.type === type; })
        .sort(function (a, b) { return sortKey(b) - sortKey(a); });
      if (group.length === 0) return "";
      return '<div class="pubgroup">' +
        '<h5 class="pubgroup__label">' + TYPE_LABEL[type] + "</h5>" +
        '<ul class="publist">' + group.map(pubItem).join("") + "</ul></div>";
    }).join("");
  }

  function renderThemes() {
    var box = byId("themes");
    if (!box) return;
    var all = Array.isArray(D.publications) ? D.publications : [];

    box.innerHTML = (D.themes || []).map(function (t) {
      var mine = all.filter(function (p) {
        return Array.isArray(p.themes) && p.themes.indexOf(t.id) !== -1;
      });
      var body = renderPublicationGroups(mine);
      var keywords = Array.isArray(t.keywords) && t.keywords.length
        ? '<p class="theme__keywords"><span>Keyword：</span>' + t.keywords.map(esc).join(' / ') + '</p>'
        : '';
      var membership = t.membership
        ? '<p class="theme__membership"><span>所属学会：</span>' + esc(t.membership) + '</p>'
        : '';

      return '<details class="theme" id="theme-' + esc(t.id) + '">' +
        '<summary class="theme__summary">' +
          (t.period ? '<span class="theme__period">' + esc(t.period) + '</span>' : '') +
          '<span class="theme__title">' + esc(t.title) + '</span>' +
        '</summary>' +
        '<div class="theme__content">' +
          (t.description ? '<p class="theme__desc">' + esc(t.description) + '</p>' : '') +
          keywords + membership + body +
        '</div>' +
      '</details>';
    }).join("");
  }

  /* ---------- プロジェクト ---------- */
  function renderProjects() {
    var box = byId("projectList");
    if (!box) return;

    box.innerHTML = (D.projects || []).map(function (pr) {
      var figure = pr.image
        ? '<img src="' + esc(pr.image) + '" alt="' + esc(pr.title) + 'の写真" loading="lazy">'
        : '<div class="card__ph">画像を追加</div>';
      var list = Array.isArray(pr.links) ? pr.links.slice() : [];
      if (pr.link) list.push({ label: pr.linkLabel || "詳細を見る", url: pr.link });
      var link = list.filter(function (l) { return l.url; }).map(function (l) {
        return '<a class="card__link" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
          esc(l.label) + " &rarr;</a>";
      }).join("");
      if (link) link = '<div class="card__links">' + link + "</div>";
      var cardExtraClass = (/エンジニアリングデザインプロジェクト/.test(pr.title) || /ASE-Lab/.test(pr.title))
        ? " card--no-image-rule" : "";
      return '<article class="card' + cardExtraClass + '">' +
        '<figure class="card__figure">' + figure + "</figure>" +
        '<div class="card__body">' +
          '<div class="card__meta"><span class="card__year">' + esc(pr.year) + "</span></div>" +
          '<h3 class="card__title">' + esc(pr.title) + "</h3>" +
          '<details class="card__details">' +
            '<summary>説明を見る</summary>' +
            '<p class="card__desc">' + esc(pr.description) + "</p>" +
          "</details>" +
          link +
        "</div></article>";
    }).join("");
  }

  /* ---------- 学歴・職歴（同じ形式で表示します） ---------- */
  function renderTrack(elementId, items) {
    var box = byId(elementId);
    if (!box) return;
    box.innerHTML = (items || []).map(function (it) {
      if (it.institution) {
        return '<li class="job education-item">' +
          '<span class="job__period education-lang-text education-lang-text--ja">' + esc(it.period) + "</span>" +
          '<span class="job__period education-lang-text education-lang-text--en">' + esc(it.periodEn || it.period) + "</span>" +
          '<div class="education-item__body">' +
            '<div class="education-lang-text education-lang-text--ja">' +
              '<p class="job__role education-item__institution">' + esc(it.institution) + "</p>" +
              (it.program ? '<p class="education-item__program">' + esc(it.program) + "</p>" : "") +
              (it.degree ? '<p class="education-item__degree">' + esc(it.degree) + "</p>" : "") +
            '</div>' +
            '<div class="education-lang-text education-lang-text--en">' +
              '<p class="job__role education-item__institution">' + esc(it.institutionEn || it.institution) + "</p>" +
              (it.programEn ? '<p class="education-item__program">' + esc(it.programEn) + "</p>" : "") +
              (it.degreeEn ? '<p class="education-item__degree">' + esc(it.degreeEn) + "</p>" : "") +
            '</div>' +
          '</div></li>';
      }
      return '<li class="job">' +
        '<span class="job__period">' + esc(it.period) + "</span>" +
        '<p class="job__role">' + esc(it.title) + "</p>" +
        (it.description ? '<p class="job__desc">' + esc(it.description) + "</p>" : "") +
      "</li>";
    }).join("");
  }

  /* ---------- リンク ---------- */
  function renderLinks() {
    var box = byId("linkList");
    if (!box) return;
    box.innerHTML = (D.links || [])
      .filter(function (l) { return l.url; })
      .map(function (l) {
        var icon = l.icon ? '<img class="link__icon" src="' + esc(l.icon) + '" alt="" aria-hidden="true">' : '';
        return '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
          icon + '<span>' + esc(l.label) + "</span></a></li>";
      }).join("");
  }

  /* ---------- 学歴 JP / EN 切り替え ---------- */
  function initEducationLanguage() {
    var section = byId("education");
    if (!section) return;
    var buttons = Array.prototype.slice.call(section.querySelectorAll("[data-education-lang]"));
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var lang = btn.getAttribute("data-education-lang") === "en" ? "en" : "ja";
        section.classList.toggle("is-en", lang === "en");
        buttons.forEach(function (b) {
          var active = b.getAttribute("data-education-lang") === lang;
          b.classList.toggle("is-active", active);
          b.setAttribute("aria-pressed", active ? "true" : "false");
        });
      });
    });
  }

  /* ---------- プロジェクトの独立伸縮 ---------- */
  function initProjectDetails() {
    document.querySelectorAll(".card__details").forEach(function (d) {
      d.addEventListener("toggle", function () {
        var card = d.closest(".card");
        if (card) card.classList.toggle("is-expanded", d.open);
        /* SPでは開く前の矢印位置を維持。閉じた時だけ中央位置を再計算する */
        if (!d.open && typeof window.updateProjectNavAnchor === "function") {
          requestAnimationFrame(function () { window.updateProjectNavAnchor(); });
        }
      });
    });
  }

  /* ---------- SP版プロジェクトカルーセル ---------- */
  function initProjectCarousel() {
    var carousel = document.querySelector(".project-carousel");
    var box = byId("projectList");
    var prev = byId("projectPrev");
    var next = byId("projectNext");
    var counter = byId("projectCounter");
    if (!carousel || !box || !prev || !next) return;
    var cards = Array.prototype.slice.call(box.querySelectorAll(".card"));
    if (!cards.length) return;
    var index = 0;

    function isSP() {
      return window.matchMedia("(max-width: 767px)").matches;
    }

    function activeCard() {
      return cards[index] || null;
    }

    function updateNavAnchor() {
      if (!isSP()) {
        carousel.style.removeProperty("--project-nav-top");
        return;
      }
      var card = activeCard();
      if (!card) return;
      var details = card.querySelector(".card__details");
      /* 展開中は、閉じていた時に記録した位置をそのまま使う */
      if (details && details.open && carousel.style.getPropertyValue("--project-nav-top")) return;
      var carouselRect = carousel.getBoundingClientRect();
      var cardRect = card.getBoundingClientRect();
      var center = cardRect.top - carouselRect.top + cardRect.height / 2;
      carousel.style.setProperty("--project-nav-top", center + "px");
    }
    window.updateProjectNavAnchor = updateNavAnchor;

    function show(i) {
      index = Math.max(0, Math.min(cards.length - 1, i));
      cards.forEach(function (card, n) {
        var active = n === index;
        card.classList.toggle("is-carousel-active", active);
        /* 次のカードへ移動した時は閉じた状態から表示 */
        if (!active) {
          var d = card.querySelector(".card__details");
          if (d) d.open = false;
        }
      });
      var currentDetails = activeCard() && activeCard().querySelector(".card__details");
      if (currentDetails) currentDetails.open = false;
      prev.disabled = index === 0;
      next.disabled = index === cards.length - 1;
      if (counter) counter.textContent = (index + 1) + " / " + cards.length;
      requestAnimationFrame(updateNavAnchor);
    }
    prev.addEventListener("click", function () { show(index - 1); });
    next.addEventListener("click", function () { show(index + 1); });

    var startX = null;
    box.addEventListener("touchstart", function (e) {
      startX = e.touches && e.touches[0] ? e.touches[0].clientX : null;
    }, { passive: true });
    box.addEventListener("touchend", function (e) {
      if (startX == null || !e.changedTouches || !e.changedTouches[0]) return;
      var dx = e.changedTouches[0].clientX - startX;
      startX = null;
      if (Math.abs(dx) < 50) return;
      if (dx < 0) show(index + 1); else show(index - 1);
    }, { passive: true });

    window.addEventListener("resize", function () {
      var d = activeCard() && activeCard().querySelector(".card__details");
      if (!d || !d.open) requestAnimationFrame(updateNavAnchor);
    });
    show(0);
  }

  /* ---------- モバイル研究アコーディオン ---------- */
  function initThemeAccordions() {
    var mq = window.matchMedia("(min-width: 1024px)");
    var details = Array.prototype.slice.call(document.querySelectorAll("details.theme"));

    function sync() {
      details.forEach(function (d) {
        d.open = mq.matches;
      });
    }
    sync();
    if (mq.addEventListener) mq.addEventListener("change", sync);
    else if (mq.addListener) mq.addListener(sync);

    document.addEventListener("click", function (e) {
      var summary = e.target.closest && e.target.closest(".theme__summary");
      if (summary && mq.matches) e.preventDefault();
    });

    function openHashTheme() {
      if (mq.matches || !location.hash) return;
      var target = document.querySelector(location.hash);
      if (target && target.matches("details.theme")) target.open = true;
    }
    window.addEventListener("hashchange", openHashTheme);
    openHashTheme();
  }

  /* ---------- BibTeXアコーディオンとコピー ---------- */
  function initPublicationActions() {
    document.addEventListener("click", function (e) {
      var toggle = e.target.closest && e.target.closest(".pub__bib-toggle");
      if (toggle) {
        var panel = document.getElementById(toggle.getAttribute("aria-controls"));
        if (!panel) return;
        var willOpen = panel.hidden;
        panel.hidden = !willOpen;
        toggle.setAttribute("aria-expanded", willOpen ? "true" : "false");
        toggle.classList.toggle("is-open", willOpen);
        return;
      }

      var copy = e.target.closest && e.target.closest(".pub__copy");
      if (!copy) return;
      var target = document.getElementById(copy.getAttribute("data-copy-target"));
      if (!target) return;
      var text = target.textContent || "";
      function done() {
        var old = copy.textContent;
        copy.textContent = "Copied";
        setTimeout(function () { copy.textContent = old; }, 1200);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {
          fallbackCopy(text); done();
        });
      } else {
        fallbackCopy(text); done();
      }
    });
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ---------- 現在位置に応じてナビを強調 ---------- */
  function initScrollSpy() {
    var nav = byId("railNav");
    if (!nav) return;
    var links = Array.prototype.slice.call(nav.querySelectorAll('a[href^="#"]'));
    var targets = links.map(function (a) {
      var id = a.getAttribute("href");
      var el = id ? document.querySelector(id) : null;
      return el ? { link: a, el: el, hash: id } : null;
    }).filter(Boolean);
    if (!targets.length) return;

    function isSP() {
      return window.matchMedia("(max-width: 1023px)").matches;
    }

    function displayHash(hash) {
      /* SPでは研究の下位項目を隠しているため、研究本体を選択表示する */
      if (isSP() && /^#theme-/.test(hash)) return "#research";
      return hash;
    }

    var lastActive = "";
    function setActive(hash, bringIntoView) {
      hash = displayHash(hash);
      if (hash === lastActive && !bringIntoView) return;
      lastActive = hash;
      var activeLink = null;
      links.forEach(function (a) {
        var active = a.getAttribute("href") === hash;
        a.classList.toggle("is-active", active);
        if (active) activeLink = a;
      });
      if (activeLink && isSP() && bringIntoView) {
        activeLink.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
      }
    }

    function headerOffset() {
      if (!isSP()) return 20;
      var rail = document.querySelector(".rail");
      return (rail ? rail.getBoundingClientRect().height : 52) + 12;
    }

    links.forEach(function (a) {
      a.addEventListener("click", function (e) {
        var hash = a.getAttribute("href");
        var target = hash ? document.querySelector(hash) : null;
        if (!target) return;
        e.preventDefault();
        if (target.matches && target.matches("details.theme") && isSP()) target.open = true;
        setActive(hash, true);
        var top = target.getBoundingClientRect().top + window.pageYOffset - headerOffset();
        window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
        if (history.pushState) history.pushState(null, "", hash);
        else location.hash = hash;
      });
    });

    function updateFromScroll() {
      var y = window.pageYOffset + headerOffset() + 34;
      var doc = document.documentElement;
      var atBottom = window.innerHeight + window.pageYOffset >= doc.scrollHeight - 6;
      var chosen = targets[0];
      targets.forEach(function (t) {
        var top = t.el.getBoundingClientRect().top + window.pageYOffset;
        if (top <= y) chosen = t;
      });
      if (atBottom) {
        var contact = targets.filter(function (t) { return t.hash === "#contact"; })[0];
        if (contact) chosen = contact;
      }
      if (chosen) setActive(chosen.hash, false);
    }

    var ticking = false;
    window.addEventListener("scroll", function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        updateFromScroll();
        ticking = false;
      });
    }, { passive: true });
    window.addEventListener("resize", updateFromScroll);
    window.addEventListener("hashchange", function () {
      if (location.hash) setActive(location.hash, true);
    });
    updateFromScroll();
  }

  fillBindings();
  renderNav();
  renderThemes();
  renderProjects();
  renderTrack("educationList", D.education);
  renderTrack("experienceList", D.experience);
  renderLinks();
  initEducationLanguage();
  initProjectDetails();
  initProjectCarousel();
  initThemeAccordions();
  initPublicationActions();
  initScrollSpy();
})();

</script>
</body>
</html>
